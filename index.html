<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Riyadh Plants</title>
  <meta name="description" content="Learn the plants of Riyadh: English and Arabic names, and how to recognise each one from its photo.">
  <meta name="theme-color" content="#f4ecdc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1f17" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Riyadh Plants">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <img class="logo" id="logo" src="icons/icon-192.png" alt="" width="40" height="40">
      <button class="icon-btn" id="backBtn" aria-label="Back" hidden>
        <svg class="flip-rtl" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <h1 class="topbar-title" id="topTitle">Riyadh Plants</h1>
      <div class="top-actions">
      <button class="icon-btn lang-btn" id="langBtn" aria-label="التبديل إلى العربية">ع</button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <input type="file" id="photoInput" accept="image/*" hidden>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/data.js"></script>
  <script src="js/world.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/care.js"></script>
  <script src="js/credits.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
